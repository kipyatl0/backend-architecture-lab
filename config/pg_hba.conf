# Правила доступа к первичному узлу базы. Файл подсовывается контейнеру
# параметром hba_file, а не дописывается в каталог данных: скрипт инициализации
# отработал бы ровно один раз — у тех, кто поднял стенд впервые, — и профиль
# cluster молча не собирался бы у всех остальных.
#
# Доверие вместо пароля здесь не небрежность, а отсутствие предмета: стенд
# живёт в одной локальной сети Compose, и пароль в нём и так лежит открытым
# текстом в docker-compose.yml. Строка про replication — та, ради которой этот
# файл вообще появился: без неё реплика не снимет базовую копию.
local   all             all                                     trust
host    all             all             all                     trust
host    replication     all             all                     trust
