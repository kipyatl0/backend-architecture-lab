# Балансировщик профиля scale (m10).
#
# Один процесс, две точки входа — и в этом весь смысл: за портом 8080 стоит
# балансировка по запросам (L7), за портом 8081 — по соединениям (L4). Инстансы
# одни и те же, клиенты одни и те же, разница только в том, что видит
# балансировщик. Сцена 31 держится ровно на ней.

worker_processes 1;
error_log  /dev/stderr warn;
pid        /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # Лог доступа выключен: вывод сцены собирается из ответов сервисов, а
    # многомегабайтный журнал под нагрузкой только шумит в docker logs.
    access_log off;

    upstream orders_l7 {
        # max_fails=0 — инстанс не выводится из ротации никогда. Предмет сцены —
        # как раскладываются запросы, а не как балансировщик лечит отказ; с
        # выводом из ротации распределение зависело бы от того, успел ли
        # инстанс ответить на предыдущий запрос.
        server orders:8050   max_fails=0;
        server orders-2:8050 max_fails=0;
        keepalive 16;
    }

    server {
        listen 8080;

        # Живость самого балансировщика, а не того, что за ним: проверка
        # здоровья не должна зависеть от готовности инстансов.
        location = /_lab/ping {
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://orders_l7;
            # Соединение до инстанса переиспользуется, но решение о том, куда
            # отправить запрос, принимается на каждом запросе — это и есть L7.
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_read_timeout 120s;
        }
    }
}

stream {
    upstream orders_l4 {
        server orders:8050   max_fails=0;
        server orders-2:8050 max_fails=0;
    }

    server {
        listen 8081;
        # Здесь балансировщик выбирает инстанс один раз — в момент, когда
        # клиент открыл соединение. Что поедет по этому соединению дальше и
        # сколько запросов в нём будет, он не знает и знать не может.
        proxy_pass orders_l4;
        proxy_timeout 120s;
    }
}
