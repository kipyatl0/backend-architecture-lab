name: smoke

# Смоук на каждый пуш: все сцены с эталонным выводом прогоняются и сверяются
# посимвольно. Расхождение = сломанный шаг курса.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  scenes:
    runs-on: ubuntu-latest
    # Тридцать девять сцен десяти профилей, и каждая поднимает свой: остановка и
    # подъём узла брокера в сценах m08 стоят десятков секунд сами по себе.
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4

      - name: собрать образы локально
        run: ./lab build

      - name: прогнать сцены и сверить с эталоном
        run: ./scripts/smoke.sh

      - name: логи сервисов при провале
        if: failure()
        run: |
          ./lab logs monolith || true
          ./lab logs acquirer || true
          ./lab logs orders || true
          ./lab logs courier || true
          ./lab logs rabbitmq || true
          ./lab logs kafka || true
          ./lab logs kafka-1 || true
          ./lab logs postgres-replica || true
          ./lab logs redis || true
          ./lab logs orders-2 || true
          ./lab logs balancer || true
          ./lab logs notifier || true
          ./lab logs jaeger || true
          ./lab logs gateway || true

      - name: погасить стенд
        if: always()
        run: ./lab down || true
